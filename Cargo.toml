[package]
name = "bug-avian-collider-density"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8.0"
bevy = "0.20.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
